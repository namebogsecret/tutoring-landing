    options: [

/* =========================================================================
   RESULTS — 3 buckets by total score
   Total possible: 8 questions × 3 pts = 24 pts max
   Thresholds: 19–24 = Strong, 13–18 = Gap, 8–12 = Risk
   ========================================================================= */
const RESULTS = {

           Времени пока хватает — но каждая неделя ожидания сужает коридор.

    body: `Судя по ответам, сочетание сжатых сроков, расстояния до целевой оценки

           <b>Здесь работает интенсивное точечное вмешательство</b> — а не «ещё
           больше того же». Ученики ровно в этой позиции поднимались на две
           оценочные ступени за восемь недель — при правильной структуре.
           Разумный первый шаг — 4-недельный <b>Mock &amp; Fix</b>: два полных
           пробных экзамена с разбором точно покажут, где утекает оценка,
           прежде чем вкладываться в полную программу.`,

      "Триаж: какие темы дают максимум баллов за оставшееся время",

/* =========================================================================
   STATE
   ========================================================================= */
let currentStep = -1;    // -1 = intro
let answers     = {};    // { q1: {score, text}, … }
let finalResult = null;

/* =========================================================================
   RENDERING
   ========================================================================= */
const main = document.getElementById('quiz-main');

function getProgress() {
  if (currentStep < 0) return 0;
  return Math.round(((currentStep) / QUESTIONS.length) * 100);
}

function getTotalScore() {
  return Object.values(answers).reduce((s, a) => s + a.score, 0);
}

function getResult(score) {
  if (score >= 19) return RESULTS.strong;
  if (score >= 13) return RESULTS.gap;
  return RESULTS.risk;
}

function renderIntro() {
  main.innerHTML = `
    <div class="intro-wrap fade-up">
      <div class="intro-eyebrow">Бесплатный тест · 5 минут</div>
      <h1 class="intro-title">Готов ли ваш ребёнок к экзамену по <em>физике</em> или математике?</h1>
      <p class="intro-lead">
        Ответьте на 8 вопросов — и получите персональный вердикт готовности
        с точным списком того, что нужно исправить до экзамена.
      </p>
      <div class="intro-chips">
        <span class="chip">IB HL / SL</span>
        <span class="chip">A-Level · IGCSE</span>
        <span class="chip">AP · SAT</span>
        <span class="chip">ЕГЭ · ОГЭ</span>
        <span class="chip">Олимпиады</span>
      </div>
      <button class="btn btn-primary btn-lg" onclick="startQuiz()" style="min-width:220px;">
        Начать диагностику →
      </button>
      <p class="intro-meta">Около 5 минут · Без регистрации и email · Полностью бесплатно</p>
    </div>
  `;
}

function renderQuestion() {
  const q   = QUESTIONS[currentStep];
  const pct = getProgress();
  const qNum = currentStep + 1;
  const sel  = answers[q.id];

  main.innerHTML = `
    <div class="progress-wrap fade-up">
      <div class="progress-label">
        <span class="step-text">Вопрос ${qNum} из ${QUESTIONS.length}</span>
        <span>Пройдено ${pct}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="quiz-card fade-up">
      <div class="q-label">${q.label}</div>
      <div class="q-text">${q.text}</div>
      ${q.sub ? `<div class="q-sub">${q.sub}</div>` : ''}
      <div class="options" id="options">
        ${q.options.map((opt, i) => `
          <button
            class="option${sel && sel.text === opt.text ? ' selected' : ''}"
            onclick="selectOption(${i})"
            aria-pressed="${sel && sel.text === opt.text}"
          >
            <span class="option-dot"></span>
            <span class="option-text">${opt.text}</span>
          </button>
        `).join('')}
      </div>

      <div class="quiz-nav">
        <button class="btn btn-ghost" onclick="goBack()" ${currentStep === 0 ? 'style="visibility:hidden"' : ''}>
          ← Назад
        </button>
        <button
          class="btn btn-primary"
          id="btn-next"
          onclick="goNext()"
          ${sel ? '' : 'disabled'}
        >
          ${currentStep < QUESTIONS.length - 1 ? 'Следующий вопрос →' : 'Показать результат →'}
        </button>
      </div>
    </div>

    <div class="quiz-footer">
      Физфак МГУ · Praxis 200/200 ×2 · <a href="${CONTACT.landing}">tutor.podlevskikh.com</a>
    </div>
  `;
}

function renderResult() {
  const score  = getTotalScore();
  const result = getResult(score);
  finalResult  = result;

  const maxScore  = QUESTIONS.length * 3;
  const fillPct   = Math.round((score / maxScore) * 100);

  // Small delay then animate the fill bar
  main.innerHTML = `
    <div class="result-wrap fade-up">
      <div class="result-card">
        <span class="result-badge ${result.badgeClass}">${result.badgeText}</span>
        <h2 class="result-headline">${result.headline}</h2>

        <div class="score-meter">
          <div class="score-meter-label">
            <span>Индекс готовности</span>
            <span class="score-val">${score} / ${maxScore}</span>
          </div>
          <div class="score-track">
            <div class="score-fill ${result.fillClass}" id="score-fill" style="width:0%"></div>
          </div>
        </div>

        <p class="result-body">${result.body}</p>

        <ul class="result-points">
          ${result.points.map(p => `<li>${p}</li>`).join('')}
        </ul>

        <div class="result-divider"></div>

        <div class="result-cta-label">${result.ctaHead}</div>
        <div class="result-cta-row">
          <a
            class="btn btn-primary btn-lg btn-full"
            href="${CONTACT.calendly}?utm_source=${TRAFFIC_SRC}&utm_medium=quiz_result&utm_campaign=${result.resultSlug}"
            target="_blank"
            rel="noopener"
          >
            📅&nbsp; Записаться на бесплатную 20-мин диагностику
          </a>
          <div class="cta-secondary">
            <span style="font-size:13px;color:var(--faint);">Или напишите напрямую:</span>
            <a
              class="btn btn-ghost"
              href="${CONTACT.telegram}"
              target="_blank"
              rel="noopener"
              style="padding:9px 16px;font-size:13.5px;"
            >
              Telegram
            </a>
          </div>
        </div>
        <p class="cta-fine">
          Бесплатная 20-минутная консультация · Продолжать не обязательно · Занятия онлайн, оплата российской или зарубежной картой
        </p>
      </div>

      <div class="quiz-footer">
        <a href="${CONTACT.landing}">← На страницу репетитора</a>
        &nbsp;·&nbsp;
        <button onclick="restartQuiz()" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;font-family:inherit;">
          Пройти ещё раз
        </button>
      </div>
    </div>
  `;

  // Animate fill bar after paint
  requestAnimationFrame(() => {
    setTimeout(() => {
      const fill = document.getElementById('score-fill');
      if (fill) fill.style.width = fillPct + '%';
    }, 80);
  });
}

/* =========================================================================
   INTERACTION
   ========================================================================= */
function startQuiz() {
  currentStep = 0;
  renderQuestion();
}

function selectOption(i) {
  const q   = QUESTIONS[currentStep];
  const opt = q.options[i];
  answers[q.id] = { score: opt.score, text: opt.text };

  // Update UI without re-render to preserve animation state
  document.querySelectorAll('.option').forEach((el, idx) => {
    if (idx === i) {
      el.classList.add('selected');
      el.setAttribute('aria-pressed', 'true');
    } else {
      el.classList.remove('selected');
      el.setAttribute('aria-pressed', 'false');
    }
  });
  const btnNext = document.getElementById('btn-next');
  if (btnNext) btnNext.removeAttribute('disabled');
}

function goNext() {
  const q = QUESTIONS[currentStep];
  if (!answers[q.id]) return;

  if (currentStep < QUESTIONS.length - 1) {
    currentStep++;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    renderResult();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function goBack() {
  if (currentStep > 0) {
    currentStep--;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (currentStep === 0) {
    currentStep = -1;
    answers = {};
    renderIntro();
  }
}

function restartQuiz() {
  currentStep = -1;
  answers     = {};
  finalResult = null;
  renderIntro();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================================
   INIT
   ========================================================================= */
document.getElementById('yr').textContent = new Date().getFullYear();
renderIntro();
</script>
