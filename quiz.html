      "Triage: identify which topics give the highest mark yield in the time left",
      "Daily-level planning — weeks matter at this stage",
      "Exam technique focused on the most common mark-earning question types"
    ],
    ctaHead: "Get an honest assessment — free 20-min diagnostic",
    resultSlug: "risk"
  }
};

/* =========================================================================
   STATE
   ========================================================================= */
let currentStep = -1;    // -1 = intro
let answers     = {};    // { q1: {score, text}, … }
let finalResult = null;

/* =========================================================================
   RENDERING
   ========================================================================= */
const main = document.getElementById('quiz-main');

function getProgress() {
  if (currentStep < 0) return 0;
  return Math.round(((currentStep) / QUESTIONS.length) * 100);
}

function getTotalScore() {
  return Object.values(answers).reduce((s, a) => s + a.score, 0);
}

function getResult(score) {
  if (score >= 19) return RESULTS.strong;
  if (score >= 13) return RESULTS.gap;
  return RESULTS.risk;
}

function renderIntro() {
  main.innerHTML = `
    <div class="intro-wrap fade-up">
      <div class="intro-eyebrow">Free 5-minute quiz</div>
      <h1 class="intro-title">Is your child ready for the <em>Physics</em> or Maths exam?</h1>
      <p class="intro-lead">
        Answer 8 questions and get a personalised readiness verdict —
        with the exact areas to focus on before the exam.
      </p>
      <div class="intro-chips">
        <span class="chip">IB HL / SL</span>
        <span class="chip">AP Physics 1 · 2 · C</span>
        <span class="chip">SAT Maths</span>
        <span class="chip">A-Level</span>
        <span class="chip">IGCSE</span>
      </div>
      <button class="btn btn-primary btn-lg" onclick="startQuiz()" style="min-width:220px;">
        Start the diagnostic →
      </button>
      <p class="intro-meta">Takes about 5 minutes · No sign-up needed · Completely free</p>
    </div>
  `;
}

function renderQuestion() {
  const q   = QUESTIONS[currentStep];
  const pct = getProgress();
  const qNum = currentStep + 1;
  const sel  = answers[q.id];

  main.innerHTML = `
    <div class="progress-wrap fade-up">
      <div class="progress-label">
        <span class="step-text">Question ${qNum} of ${QUESTIONS.length}</span>
        <span>${pct}% complete</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="quiz-card fade-up">
      <div class="q-label">${q.label}</div>
      <div class="q-text">${q.text}</div>
      ${q.sub ? `<div class="q-sub">${q.sub}</div>` : ''}
      <div class="options" id="options">
        ${q.options.map((opt, i) => `
          <button
            class="option${sel && sel.text === opt.text ? ' selected' : ''}"
            onclick="selectOption(${i})"
            aria-pressed="${sel && sel.text === opt.text}"
          >
            <span class="option-dot"></span>
            <span class="option-text">${opt.text}</span>
          </button>
        `).join('')}
      </div>

      <div class="quiz-nav">
        <button class="btn btn-ghost" onclick="goBack()" ${currentStep === 0 ? 'style="visibility:hidden"' : ''}>
          ← Back
        </button>
        <button
          class="btn btn-primary"
          id="btn-next"
          onclick="goNext()"
          ${sel ? '' : 'disabled'}
        >
          ${currentStep < QUESTIONS.length - 1 ? 'Next question →' : 'See my result →'}
        </button>
      </div>
    </div>

    <div class="quiz-footer">
      MSU Physicist · Praxis 200/200 ×2 · <a href="${CONTACT.landing}">tutor.podlevskikh.com</a>
    </div>
  `;
}

function renderResult() {
  const score  = getTotalScore();
  const result = getResult(score);
  finalResult  = result;

  const maxScore  = QUESTIONS.length * 3;
  const fillPct   = Math.round((score / maxScore) * 100);

  // Small delay then animate the fill bar
  main.innerHTML = `
    <div class="result-wrap fade-up">
      <div class="result-card">
        <span class="result-badge ${result.badgeClass}">${result.badgeText}</span>
        <h2 class="result-headline">${result.headline}</h2>

        <div class="score-meter">
          <div class="score-meter-label">
            <span>Readiness score</span>
            <span class="score-val">${score} / ${maxScore}</span>
          </div>
          <div class="score-track">
            <div class="score-fill ${result.fillClass}" id="score-fill" style="width:0%"></div>
          </div>
        </div>

        <p class="result-body">${result.body}</p>

        <ul class="result-points">
          ${result.points.map(p => `<li>${p}</li>`).join('')}
        </ul>

        <div class="result-divider"></div>

        <div class="result-cta-label">${result.ctaHead}</div>
        <div class="result-cta-row">
          <a
            class="btn btn-primary btn-lg btn-full"
            href="${CONTACT.calendly}?utm_source=quiz&utm_medium=result&utm_campaign=${result.resultSlug}"
            target="_blank"
            rel="noopener"
          >
            📅&nbsp; Book a free 20-min diagnostic on Calendly
          </a>
          <div class="cta-secondary">
            <span style="font-size:13px;color:var(--faint);">Or message directly:</span>
            <a
              class="btn btn-ghost"
              href="${CONTACT.telegram}"
              target="_blank"
              rel="noopener"
              style="padding:9px 16px;font-size:13.5px;"
            >
              Telegram
            </a>
          </div>
        </div>
        <p class="cta-fine">
          Free 20-minute call · No obligation · Payment in USD / EUR via Payoneer or secure card link
        </p>
      </div>

      <div class="quiz-footer">
        <a href="${CONTACT.landing}">← Back to tutor page</a>
        &nbsp;·&nbsp;
        <button onclick="restartQuiz()" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;font-family:inherit;">
          Retake quiz
        </button>
      </div>
    </div>
  `;

  // Animate fill bar after paint
  requestAnimationFrame(() => {
    setTimeout(() => {
      const fill = document.getElementById('score-fill');
      if (fill) fill.style.width = fillPct + '%';
    }, 80);
  });
}

/* =========================================================================
   INTERACTION
   ========================================================================= */
function startQuiz() {
  currentStep = 0;
  renderQuestion();
}

function selectOption(i) {
  const q   = QUESTIONS[currentStep];
  const opt = q.options[i];
  answers[q.id] = { score: opt.score, text: opt.text };

  // Update UI without re-render to preserve animation state
  document.querySelectorAll('.option').forEach((el, idx) => {
    if (idx === i) {
      el.classList.add('selected');
      el.setAttribute('aria-pressed', 'true');
    } else {
      el.classList.remove('selected');
      el.setAttribute('aria-pressed', 'false');
    }
  });
  const btnNext = document.getElementById('btn-next');
  if (btnNext) btnNext.removeAttribute('disabled');
}

function goNext() {
  const q = QUESTIONS[currentStep];
  if (!answers[q.id]) return;

  if (currentStep < QUESTIONS.length - 1) {
    currentStep++;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    renderResult();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function goBack() {
  if (currentStep > 0) {
    currentStep--;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (currentStep === 0) {
    currentStep = -1;
    answers = {};
    renderIntro();
  }
}

function restartQuiz() {
  currentStep = -1;
  answers     = {};
  finalResult = null;
  renderIntro();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================================
   INIT
   ========================================================================= */
document.getElementById('yr').textContent = new Date().getFullYear();
renderIntro();
</script>

<!--
SMOKE-TEST — three result states and how to trigger them manually:

  STRONG (score 19–24): Answer all top options
    Q1→any, Q2→"More than 24 weeks", Q3→"Strong — consistently scoring near their target",
    Q4→"IB 6–7 / AP 4–5 ...", Q5→"No major weakness", Q6→"Structured and consistent",
    Q7→"Very close — one grade or less", Q8→"Yes, it helped"
    → Score: 3+3+3+3+3+3+3+3 = 24 → badge: "Strong position"

  GAP (score 13–18): Mix of medium answers
    Q1→any(3), Q2→"6–12 weeks"(2), Q3→"Mixed"(2), Q4→"IB 5 / AP 3–4..."(2),
    Q5→"Mechanics"(2), Q6→"Self-studying"(2), Q7→"Moderate"(2), Q8→"First time"(2)
    → Score: 3+2+2+2+2+2+2+2 = 17 → badge: "Targeted gaps to close"

  RISK (score 8–12): Bottom options throughout
    Q1→any(score counts 3 for exam type, rest low), Q2→"Fewer than 6 weeks"(1),
    Q3→"Struggling"(1), Q4→"Just passing"(1), Q5→"Exam technique"(1),
    Q6→"Not much happening"(1), Q7→"Significant — three or more"(1), Q8→"Yes, disappointing"(1)
    → Score: 3+1+1+1+1+1+1+1 = 10 → badge: "Action needed now"
-->
